[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pond"
version = "3.0.0.dev0"
description = "Provides core functionality for Pond, an AI plugin for the Fish shell."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "agent-client-protocol==0.9.0",
  "websockets==15.0.1",
  "rich==13.9.4"
]

[project.urls]
"Homepage" = "https://github.com/bndlfm/pond.fish"
"Bug Tracker" = "https://github.com/bndlfm/pond.fish/issues"

[project.scripts]
pond-action = "pond.action_cli:main"
pond-compress = "pond.action_cli:compress_main"
pond-context = "pond.action_cli:context_main"
pond-forget = "pond.action_cli:forget_main"
pond-status = "pond.action_cli:status_main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["src/pond/tests"]

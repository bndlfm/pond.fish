[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pond"
version = "3.0.0.dev0"
description = "Provides core functionality for Pond, an AI plugin for the Fish shell."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "agent-client-protocol==0.9.0",
  "openai==2.32.0",
  "simple-term-menu==1.6.6",
  "iterfzf==1.9.0.67.0",
  "mistralai==2.4.0",
  "binaryornot==0.6.0",
  "anthropic==0.96.0",
  "keyring==25.7.0",
  "groq==1.1.2",
  "google-genai==1.73.1",
  "httpx[socks]==0.28.1",
  "aws-bedrock-token-generator==1.1.0",
  "rich==13.9.4"
]

[project.urls]
"Homepage" = "https://github.com/bndlfm/pond.fish"
"Bug Tracker" = "https://github.com/bndlfm/pond.fish/issues"

[project.scripts]
fix = "pond.fix:fix"
codify = "pond.codify:codify"
explain = "pond.explain:explain"
autocomplete = "pond.autocomplete:autocomplete"
switch_context = "pond.switch_context:switch_context"
put_api_key = "pond.put_api_key:put_api_key"
lookup_setting = "pond.config:lookup_setting"
put_setting = "pond.config:put_setting"
refine = "pond.autocomplete:refine_completions"
agent = "pond.agent:main"
ai = "pond.ai:main"
render = "pond.agent:render_markdown"
pond-action = "pond.action_cli:main"
pond-compress = "pond.action_cli:compress_main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["src/pond/tests"]
